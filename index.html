<script>

let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){db=structuredClone(defaults)}for(const k in defaults)if(!Array.isArray(db[k]))db[k]=structuredClone(defaults[k]);
let tab='itinerary',day=dates[0],more='';const $=s=>document.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:0});const pct=a=>a.length?Math.round(a.filter(x=>x.done).length/a.length*100):0;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const title=(name,right='')=>'<div class="section-title"><h2>'+name+'</h2>'+right+'</div>';const add=(type,label='＋ 新增')=>'<button class="btn small" onclick="edit(\''+type+'\')">'+label+'</button>';const line=(a,b)=>'<div class="row"><span class="muted">'+a+'</span><b>'+b+'</b></div>';

else if(tab==='itinerary'){const n=dates.indexOf(day),items=db.events.filter(x=>x.date===day).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));out=title('每日行程',add('events'))+'<div class="tabs trip-tabs">'+dates.map((d,i)=>'<button class="pill '+(day===d?'active':'')+'" onclick="day=\''+d+'\';render()"><small>D'+(i+1)+'</small><strong>12/'+(24+i)+'</strong></button>').join('')+'</div><div class="day-summary"><small>🎄 CHRISTMAS CRUISE · DAY '+(n+1)+'</small><strong>12 月 '+(24+n)+' 日 · '+['週四','週五','週六','週日','週一'][n]+'</strong><div class="day-sub">🚢 MSC BELLISSIMA　·　'+items.length+' 項行程</div></div>'+renderEvents(items);}

else if(tab==='more'){if(!more){out=title('更多功能')+'<div class="menu"><button onclick="more=\'packing\';render()"><span>🧳</span>行李清單</button><button onclick="more=\'bookings\';render()"><span>🎫</span>預訂管理</button><button onclick="more=\'notes\';render()"><span>📝</span>旅行備忘</button><button onclick="more=\'ship\';render()"><span>🚢</span>郵輪資訊</button><button onclick="more=\'backup\';render()"><span>💾</span>資料備份</button></div>';}else{out='<button class="btn secondary small" onclick="more=\'\';render()">← 返回更多</button><div style="height:15px"></div>';if(more==='packing'){out+=title('行李清單',add('packing'))+'<div class="banner">準備進度 '+pct(db.packing)+'%</div>'+renderChecks(db.packing,'packing');}else if(more==='bookings'){out+=title('預訂管理',add('bookings'))+db.bookings.map(x=>'<div class="item"><div class="body"><b>'+escape(x.title)+'</b><p>'+escape(x.date)+' · '+escape(x.place)+'</p><span class="tag">'+escape(x.status)+'</span></div><button class="iconbtn" onclick="edit(\'bookings\',\''+x.id+'\')">✎</button></div>').join('');if(!db.bookings.length)out+='<div class="empty">還沒有預訂資料 🎫</div>';}else if(more==='notes'){out+=title('旅行備忘',add('notes'))+db.notes.map(x=>'<div class="item"><div class="body"><b>'+escape(x.title)+'</b><p>'+escape(x.note)+'</p></div><button class="iconbtn" onclick="edit(\'notes\',\''+x.id+'\')">✎</button></div>').join('');if(!db.notes.length)out+='<div class="empty">隨時記下想吃、想買、想做的事 📝</div>';}else if(more==='ship'){out+=title('MSC Bellissima')+'<div class="card"><b>🚢 船上資訊</b><p class="muted">這裡將整理餐廳、劇院、樓層、活動與登船須知。正式時間及規定請以船公司通知為準。</p><div class="banner">📍 出發：2026/12/24 · 基隆港<br>📅 航程：2026/12/24—12/28</div></div>';}else if(more==='backup'){out+=title('資料備份')+'<div class="card"><p>第一版資料儲存在目前這台裝置的瀏覽器。請定期匯出備份；清除網站資料可能導致內容消失。</p><button class="btn" onclick="backup()">⬇ 匯出 JSON 備份</button><p class="muted">匯入備份：</p><input type="file" accept="application/json,.json" onchange="restore(event)"></div>';}}}
$('#app').innerHTML=out+'<div class="foot">MSC BELLISSIMA · CHRISTMAS 2026 ✦ V1</div>';}
function isShipEvent(x){return x.locationType==='ship'||(!x.locationType&&/船上|郵輪|甲板|劇院|自助餐|牛排館|安全講習/.test([x.place,x.title].join(' ')))}
function mapHref(x){const q=(x.mapQuery||x.place||'').trim();return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
function renderEvents(a){return a.length?'<div class="timeline">'+a.map(x=>{const ship=isShipEvent(x),place=escape(x.place||'地點待定'),loc=ship?'<span class="deck-chip">🚢 '+place+(x.deck?' · '+escape(x.deck)+' 樓':'')+'</span>':(x.place||x.mapQuery?'<a class="map-link" href="'+escape(mapHref(x))+'" target="_blank" rel="noopener noreferrer">📍 Google Maps ↗</a>':'<span class="status-chip">📍 地點待確認</span>');return '<div class="timeline-entry"><div class="timeline-clock">'+escape(x.time||'待定')+'</div><div class="timeline-track"><span class="timeline-dot"></span></div><div class="timeline-card"><div class="category-ribbon '+(ship?'ship':'port')+'">'+(ship?'🚢 船上活動':'📍 岸上／港口行程')+'</div><div class="row"><div style="min-width:0"><b>'+escape(x.title)+'</b><p>'+place+(x.note?'\n'+escape(x.note):'')+'</p></div><button class="iconbtn" onclick="edit(\'events\',\''+x.id+'\')">✎</button></div><div class="place-actions">'+loc+(x.bookingStatus?'<span class="status-chip">🎟 '+escape(x.bookingStatus)+'</span>':'')+'</div></div></div>'}).join('')+'</div>':'<div class="empty">這天還沒有安排，新增一個行程吧 ✨</div>'}
function renderChecks(a,type){return a.length?a.map(x=>'<div class="item"><input class="check" type="checkbox" '+(x.done?'checked':'')+' onchange="toggle(\''+type+'\',\''+x.id+'\')"><div class="body"><b style="'+(x.done?'text-decoration:line-through;color:#929a9e':'')+'">'+escape(x.title)+'</b><p>'+escape(type==='tasks'?(x.due?'截止 '+x.due:'無截止日期'):(x.category||'其他'))+'</p>'+(x.priority==='高'&&!x.done?'<span class="tag">優先</span>':'')+'</div><button class="iconbtn" onclick="edit(\''+type+'\',\''+x.id+'\')">✎</button></div>').join(''):'<div class="empty">目前沒有項目，點選新增開始 ✨</div>'}
function go(t){tab=t;more='';render();scrollTo({top:0,behavior:'smooth'})}function toggle(t,id){const x=db[t].find(x=>x.id===id);if(x){x.done=!x.done;save()}}
const schema={events:[['date','日期','date'],['time','時間','time'],['title','活動名稱','text'],['place','地點／船上場所','text'],['locationType','行程位置','select','shore|ship'],['deck','船上樓層（可不填）','text'],['mapQuery','Google Maps 搜尋地點（岸上可不填）','text'],['bookingStatus','預約狀態','select','不需預約|待預約|已預約|待確認'],['note','備註','textarea']],tasks:[['title','待辦事項','text'],['due','截止日期','date'],['priority','優先程度','select','高|中|低']],packing:[['title','物品名稱','text'],['category','分類','select','證件|衣物|電子用品|藥品|盥洗用品|其他']],expenses:[['title','項目','text'],['amount','金額（台幣）','number'],['date','付款日期','date'],['payer','付款人／備註','text'],['paid','付款狀態','select','未付款|已付款']],bookings:[['title','預訂名稱','text'],['date','日期','date'],['place','地點／訂單編號','text'],['status','狀態','select','未預訂|已預訂|已完成']],notes:[['title','標題','text'],['note','內容','textarea']]};
function edit(type,id){const obj=id?db[type].find(x=>x.id===id):null;const labels={events:'行程',tasks:'待辦',packing:'行李',expenses:'記帳',bookings:'預訂',notes:'備忘'};$('#modal-title').textContent=(obj?'編輯':'新增')+labels[type];let html=schema[type].map(([key,label,kind,opts])=>{let value=obj?obj[key]??'':key==='date'&&type==='events'?day:'';if(kind==='select'){if(key==='paid')value=obj?(obj.paid?'已付款':'未付款'):'未付款';if(key==='locationType')value=obj?(obj.locationType|| (isShipEvent(obj)?'ship':'shore')):'shore';if(key==='bookingStatus')value=obj?(obj.bookingStatus||'不需預約'):'不需預約';return '<label class="field">'+label+'<select name="'+key+'">'+opts.split('|').map(v=>'<option value="'+v+'" '+(value===v?'selected':'')+'>'+(key==='locationType'?(v==='ship'?'🚢 船上（不使用地圖）':'📍 岸上／港口（Google Maps）'):v)+'</option>').join('')+'</select></label>'}return '<label class="field">'+label+(kind==='textarea'?'<textarea name="'+key+'">'+escape(value)+'</textarea>':'<input name="'+key+'" type="'+kind+'" value="'+escape(value)+'" '+(key==='title'?'required':'')+' '+(kind==='number'?'min="0" step="1"':'')+'>')+'</label>'}).join('');html+='<div class="formactions">'+(obj?'<button type="button" class="btn danger" id="del">刪除</button>':'')+'<button type="button" class="btn secondary" onclick="document.getElementById(\'dialog\').close()">取消</button><button class="btn" type="submit">儲存</button></div>';$('#form').innerHTML=html;$('#form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());if(type==='expenses'){d.amount=Math.max(0,Number(d.amount)||0);d.paid=d.paid==='已付款'}if(obj){Object.assign(obj,d)}else{db[type].push({id:uid(),...d,...(['tasks','packing'].includes(type)?{done:false}:{})})}$('#dialog').close();save()};if(obj)$('#del').onclick=()=>{if(confirm('確定要刪除這筆資料嗎？')){db[type]=db[type].filter(x=>x.id!==id);$('#dialog').close();save()}};$('#dialog').showModal()}
function backup(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='msc-christmas-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function restore(e){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Object.keys(defaults).every(k=>Array.isArray(d[k])))throw Error('格式錯誤');if(confirm('匯入會取代這台裝置目前的全部資料，確定嗎？')){db=d;save();alert('匯入完成')}}catch(err){alert('備份檔格式不正確')}};reader.readAsText(f)}
render();
</script></body></html>
